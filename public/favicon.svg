<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Dark background circle -->
  <circle cx="16" cy="16" r="16" fill="#0a0f1a"/>

  <!-- Shield body -->
  <path d="M16 4 L26 8.5 L26 16 C26 21.5 21.5 26.5 16 28 C10.5 26.5 6 21.5 6 16 L6 8.5 Z"
        fill="#0d1b2e" stroke="#00d4ff" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Shield inner highlight -->
  <path d="M16 6.5 L24 10.2 L24 16 C24 20.4 20.5 24.5 16 25.8 C11.5 24.5 8 20.4 8 16 L8 10.2 Z"
        fill="none" stroke="#00d4ff" stroke-width="0.4" stroke-linejoin="round" opacity="0.4"/>

  <!-- Rewind/time arrows (two left-pointing chevrons) -->
  <g fill="#00d4ff" opacity="0.95">
    <!-- Left chevron -->
    <polygon points="12,16 15.5,12.5 15.5,14.5 13.5,16 15.5,17.5 15.5,19.5"/>
    <!-- Right chevron -->
    <polygon points="15.5,16 19,12.5 19,14.5 17,16 19,17.5 19,19.5"/>
  </g>

  <!-- Small arc suggesting clock/time at top of shield -->
  <path d="M13 11 A4 4 0 0 1 19 11" fill="none" stroke="#00d4ff" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
</svg>
